# DeepSeek 原生浏览器扩展 — profile patch layer.
#
# The app-side debugging endpoint is discovered at runtime (DevToolsActivePort /
# browser-cdp.json / conventional ports). When the app starts without browser
# debugging, the plugin shows a Cancel/OK dialog after a few seconds; OK
# restarts the app with an ephemeral debugging port, Cancel leaves it untouched.
- insert:
    - id: native-browser
      name: dsh-native-browser-bdg
      disabled: !!js "ctx.get('profileContext')?.name !== 'desktop'"
      config:
        autoRestart: prompt
